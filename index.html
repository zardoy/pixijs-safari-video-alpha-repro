	function clipUrl() {
		const bytes = Uint8Array.from(atob(CLIP_BASE64), (c) => c.charCodeAt(0))
		return URL.createObjectURL(new Blob([bytes], { type: 'video/quicktime' }))
	}

	async function cell(hostId, resultId, workaround) {
		const app = new PIXI.Application()
		await app.init({ width: 256, height: 256, backgroundAlpha: 0, preference: 'webgl' })
		document.getElementById(hostId).appendChild(app.canvas)

		if (workaround) {
			// Pixi >= 8.15 (#11867) defaults forceAllocation to isSafari(): texImage2D on every upload. Put it back to texSubImage2D.
			const uploads = app.renderer.texture._uploads
			const original = uploads.video
			uploads.video = { ...original, upload: (s, t, gl, v) => original.upload(s, t, gl, v, undefined, false) }
		}

		const video = document.createElement('video')
		video.src = clipUrl()
		video.muted = true
		video.loop = true
		video.playsInline = true
		await video.play()

		const sprite = new PIXI.Sprite(PIXI.Texture.from(video))
		sprite.width = sprite.height = 256
		app.stage.addChild(sprite)

		// Verdict, accumulated over a few seconds of playback. The clip is an orange disc on a fully transparent
		// background, so: background opaque (alpha > 0 at a corner) = alpha lost; disc pixels drawn while the
		// background stayed transparent = alpha kept.
		const rt = PIXI.RenderTexture.create({ width: 128, height: 128 })
		let cornerMax = 0, discSeen = false
		setInterval(() => {
			app.renderer.render({ container: sprite, target: rt, clear: true, clearColor: [0, 0, 0, 0] })
			const { pixels } = app.renderer.extract.pixels(rt)
			cornerMax = Math.max(cornerMax, pixels[(4 * 128 + 4) * 4 + 3], pixels[(4 * 128 + 123) * 4 + 3])
			for (let i = 0; i < pixels.length && !discSeen; i += 4) discSeen = pixels[i + 3] > 200 && pixels[i] > 150
			const el = document.getElementById(resultId)
			if (cornerMax > 0) { el.textContent = `alpha LOST (transparent background came out opaque, alpha = ${cornerMax})`; el.className = 'bad' }
			else if (discSeen) { el.textContent = 'alpha kept (disc drawn, background transparent)'; el.className = 'ok' }
			else { el.textContent = 'nothing drawn yet…'; el.className = '' }
		}, 250)
	}

	document.getElementById('v').textContent = PIXI.VERSION
	document.getElementById('ua').textContent = navigator.userAgent
	cell('a', 'ra', false)
	cell('b', 'rb', true)
</script>
